name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run typecheck

      # postinstall rebuilds better-sqlite3 against Electron's Node ABI;
      # vitest runs under plain Node, so rebuild back before testing.
      # electron-builder rebuilds for Electron's ABI again when packaging.
      - run: npm rebuild better-sqlite3

      - run: npm test

      - run: npm run build

      - name: Build and publish NSIS installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
