name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run typecheck

      # postinstall rebuilds better-sqlite3 against Electron's Node ABI;
      # vitest runs under plain Node, so rebuild back before testing.
      # electron-builder rebuilds for Electron's ABI again when packaging.
      - run: npm rebuild better-sqlite3

      - run: npm test

      - run: npm run build

      # electron-builder's internal @electron/rebuild step doesn't always
      # detect that better-sqlite3 was swapped back to the plain-Node ABI
      # by the step above (its cache thinks this Electron version was
      # already handled from the postinstall rebuild) - force it explicitly
      # so the shipped binary is never left on the wrong ABI.
      - run: npx electron-rebuild -f -w better-sqlite3

      - name: Build and publish NSIS installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
